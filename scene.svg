<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- sky -->
  <rect x="0" y="0" width="400" height="300" fill="#0a0a0a" />

  <!-- house body -->
  <rect x="120" y="150" width="160" height="120" fill="white" />

  <!-- roof -->
  <polygon points="100,150 200,60 300,150" fill="#2A2A2A" />

  <!-- red front door -->
  <rect x="170" y="210" width="60" height="60" fill="#cc0000" />

  <!-- door knob -->
  <rect x="222" y="243" width="6" height="6" fill="#c8a86b" />

  <!-- windows -->
  <rect x="130" y="165" width="35" height="35" fill="#6ab0d8" />
  <rect x="235" y="165" width="35" height="35" fill="#6ab0d8" />

  <!-- window cross bars -->
  <rect x="130" y="180" width="35" height="4" fill="white" />
  <rect x="145" y="165" width="4" height="35" fill="white" />
  <rect x="235" y="180" width="35" height="4" fill="white" />
  <rect x="250" y="165" width="4" height="35" fill="white" />

  <!-- chimney -->
  <rect x="230" y="75" width="25" height="50" fill="#2A2A2A" />

  <!-- ground -->
  <rect x="0" y="265" width="400" height="35" fill="#2A2A2A" />

  <!-- barley's body (fluffy = wider) -->
  <rect x="30" y="225" width="60" height="30" fill="#c8a86b" />

  <!-- barley's fluffy chest/belly fur -->
  <rect x="30" y="235" width="20" height="20" fill="#e8d0a0" />

  <!-- darker back -->
  <rect x="50" y="225" width="40" height="12" fill="#b87840" />

  <!-- barley's head (simpler, lighter) -->
  <rect x="72" y="210" width="30" height="25" fill="#c8a86b" />

  <!-- dark ear left -->
  <rect x="68" y="205" width="10" height="20" fill="#7a4010" />

  <!-- dark ear right -->
  <rect x="92" y="203" width="10" height="18" fill="#7a4010" />

  <!-- dark face mask (his darker coloring) -->
  <rect x="76" y="215" width="22" height="15" fill="#a06030" />

  <!-- eye -->
  <rect x="80" y="216" width="5" height="5" fill="#0a0a0a" />
  <!-- eye shine -->
  <rect x="81" y="217" width="2" height="2" fill="white" />

  <!-- eye 2 -->
  <rect x="90" y="216" width="5" height="5" fill="#0a0a0a" />
  <!-- eye 2 shine -->
  <rect x="91" y="217" width="2" height="2" fill="white" />

  <!-- nose -->
  <rect x="82" y="226" width="8" height="5" fill="#0a0a0a" />

  <!-- legs -->
  <rect x="43" y="253" width="10" height="12" fill="#c8a86b" />
  <rect x="60" y="253" width="10" height="12" fill="#c8a86b" />
  <rect x="78" y="253" width="10" height="12" fill="#c8a86b" />
  <rect x="30" y="253" width="10" height="12" fill="#c8a86b" />

  <!-- big fluffy tail (grouped for animation) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-10 36 225; 10 36 225; -10 36 225" dur="0.9s"
      repeatCount="indefinite" additive="sum" />
    <rect x="18" y="215" width="18" height="12" fill="#c8a86b" />
    <rect x="10" y="203" width="16" height="12" fill="#c8a86b" />
    <rect x="16" y="193" width="14" height="12" fill="#b87840" />
  </g>

  <!-- mailbox post -->
  <rect x="320" y="230" width="8" height="40" fill="#888888" />

  <a href="recipes.html">
    <!-- fish tail (behind body) -->
    <polygon points="333,213 350,204 350,228 333,219" fill="#6ab0d8">
      <animateTransform attributeName="transform" type="rotate" values="-15 336 221; 15 336 221; -15 336 221"
        dur="1.2s" repeatCount="indefinite" additive="sum" />
    </polygon>
    <!-- fish body (on top) -->
    <rect x="295" y="210" width="45" height="22" fill="#6ab0d8" />
    <!-- fish eye -->
    <rect x="300" y="216" width="6" height="6" fill="#0a0a0a" />
    <!-- fish eye shine -->
    <rect x="301" y="217" width="2" height="2" fill="white" />
    <!-- fish mouth/mailbox opening -->
    <rect x="292" y="218" width="6" height="6" fill="#0a0a0a" />
    <!-- fish scales (decorative) -->
    <rect x="310" y="213" width="8" height="6" fill="#4a90b8" />
    <rect x="322" y="213" width="8" height="6" fill="#4a90b8" />
  </a>

  <!-- stars - varied sizes and delays -->
  <rect x="20" y="20" width="3" height="3" fill="white" class="star" style="animation-delay: 0s" />
  <rect x="60" y="45" width="4" height="4" fill="white" class="star" style="animation-delay: 0.7s" />
  <rect x="110" y="15" width="3" height="3" fill="white" class="star" style="animation-delay: 1.3s" />
  <rect x="160" y="35" width="4" height="4" fill="white" class="star" style="animation-delay: 0.4s" />
  <rect x="240" y="20" width="3" height="3" fill="white" class="star" style="animation-delay: 1.8s" />
  <rect x="290" y="40" width="4" height="4" fill="white" class="star" style="animation-delay: 0.9s" />
  <rect x="340" y="15" width="3" height="3" fill="white" class="star" style="animation-delay: 1.1s" />
  <rect x="375" y="35" width="4" height="4" fill="white" class="star" style="animation-delay: 0.3s" />
</svg>
