<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missy & Barley</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="box">
    <h1>Missy & Barley</h1>
    <div id="scene"></div>
  </div>

  <script>
    function goTo(view) {
      fetch(`scenes/${view}.svg`)
        .then(r => r.text())
        .then(svg => {
          document.getElementById('scene').innerHTML = svg;
        });
    }

    // load the starting scene
    goTo('exterior');
  </script>

</body>
</html>
