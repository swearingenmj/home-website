<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missy & Barley</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="box">
    <h1>Missy & Barley</h1>
    <p>This site is a work in progress. Check back soon!</p>

    <div id="scene"></div>
  </div>
  <script>
  fetch('scene.svg')
    .then(response => response.text())
    .then(svg => {
      document.getElementById('scene').innerHTML = svg;
      console.log('scene loaded!');
    })
    .catch(error => {
      console.log('error:', error);
    });
</script>
</body>

</html>
