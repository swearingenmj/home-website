<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">

  <!-- ── FLOOR ── -->
  <rect x="0" y="380" width="800" height="120" fill="#c8a86b"/>
  <rect x="0"   y="388" width="800" height="3" fill="#b89050" opacity="0.4"/>
  <rect x="0"   y="403" width="800" height="3" fill="#b89050" opacity="0.4"/>
  <rect x="0"   y="418" width="800" height="3" fill="#b89050" opacity="0.4"/>
  <rect x="0"   y="433" width="800" height="3" fill="#b89050" opacity="0.4"/>
  <rect x="0"   y="448" width="800" height="3" fill="#b89050" opacity="0.4"/>
  <rect x="100" y="380" width="2" height="120" fill="#b89050" opacity="0.3"/>
  <rect x="250" y="380" width="2" height="120" fill="#b89050" opacity="0.3"/>
  <rect x="400" y="380" width="2" height="120" fill="#b89050" opacity="0.3"/>
  <rect x="550" y="380" width="2" height="120" fill="#b89050" opacity="0.3"/>
  <rect x="700" y="380" width="2" height="120" fill="#b89050" opacity="0.3"/>

  <!-- ── FANCY ROOM FLOOR ── -->
  <rect x="100" y="345" width="600" height="35" fill="#d4c8a8"/>
  <!-- rug hint -->
  <rect x="200" y="348" width="400" height="28" fill="#9D74A1" opacity="0.25"/>
  <rect x="204" y="352" width="392" height="20" fill="#9D74A1" opacity="0.15"/>

  <!-- ── FANCY ROOM WALLS ── -->
  <rect x="100" y="100" width="600" height="280" fill="#f0ebe2"/>

  <!-- ── CEILING ── -->
  <rect x="0" y="0" width="800" height="100" fill="#e8e4dc"/>
  <rect x="0" y="95" width="800" height="8"  fill="#d8d4cc"/>

  <!-- ── SIDE WALLS (foyer framing the arch) ── -->
  <rect x="0"   y="0" width="100" height="500" fill="#e0dcd4"/>
  <rect x="700" y="0" width="100" height="500" fill="#e0dcd4"/>

  <!-- ── WAINSCOTING (fancy room) ── -->
  <rect x="100" y="290" width="600" height="55" fill="#e8e4dc"/>
  <rect x="100" y="288" width="600" height="5"  fill="#d8d4cc"/>
  <!-- wainscoting panels -->
  <rect x="116" y="300" width="100" height="38" fill="none" stroke="#d0ccc4" stroke-width="2"/>
  <rect x="232" y="300" width="100" height="38" fill="none" stroke="#d0ccc4" stroke-width="2"/>
  <rect x="348" y="300" width="100" height="38" fill="none" stroke="#d0ccc4" stroke-width="2"/>
  <rect x="464" y="300" width="100" height="38" fill="none" stroke="#d0ccc4" stroke-width="2"/>
  <rect x="580" y="300" width="108" height="38" fill="none" stroke="#d0ccc4" stroke-width="2"/>

  <!-- ══ STONE FIREPLACE (centered) ══ -->
  <!-- fireplace surround -->
  <rect x="290" y="130" width="220" height="200" fill="#d0c8c0"/>
  <!-- stones - row 1 -->
  <rect x="298" y="138" width="42"  height="20"  fill="#c8c0b8"/>
  <rect x="344" y="138" width="36"  height="20"  fill="#beb6ae"/>
  <rect x="384" y="138" width="44"  height="20"  fill="#c8c0b8"/>
  <rect x="432" y="138" width="36"  height="20"  fill="#beb6ae"/>
  <rect x="472" y="138" width="34"  height="20"  fill="#c8c0b8"/>
  <!-- row 2 -->
  <rect x="298" y="162" width="34"  height="20"  fill="#beb6ae"/>
  <rect x="336" y="162" width="46"  height="20"  fill="#c8c0b8"/>
  <rect x="386" y="162" width="36"  height="20"  fill="#beb6ae"/>
  <rect x="426" y="162" width="42"  height="20"  fill="#c8c0b8"/>
  <rect x="472" y="162" width="34"  height="20"  fill="#beb6ae"/>
  <!-- row 3 -->
  <rect x="298" y="186" width="46"  height="20"  fill="#c8c0b8"/>
  <rect x="348" y="186" width="34"  height="20"  fill="#beb6ae"/>
  <rect x="386" y="186" width="44"  height="20"  fill="#c8c0b8"/>
  <rect x="434" y="186" width="36"  height="20"  fill="#beb6ae"/>
  <rect x="474" y="186" width="32"  height="20"  fill="#c8c0b8"/>
  <!-- row 4 -->
  <rect x="298" y="210" width="36"  height="20"  fill="#beb6ae"/>
  <rect x="338" y="210" width="44"  height="20"  fill="#c8c0b8"/>
  <rect x="386" y="210" width="38"  height="20"  fill="#beb6ae"/>
  <rect x="428" y="210" width="44"  height="20"  fill="#c8c0b8"/>
  <rect x="476" y="210" width="30"  height="20"  fill="#beb6ae"/>

  <!-- fireplace opening -->
  <rect x="326" y="234" width="148" height="90"  fill="#1a0a2e"/>
  <!-- fire glow on floor -->
  <rect x="326" y="316" width="148" height="8"   fill="#E8956D" opacity="0.3"/>
  <!-- flames -->
  <rect x="342" y="290" width="16"  height="32"  fill="#E8956D" opacity="0.9"/>
  <rect x="362" y="278" width="20"  height="44"  fill="#E8C97A" opacity="0.9"/>
  <rect x="386" y="270" width="24"  height="52"  fill="#E8C97A" opacity="0.9"/>
  <rect x="414" y="280" width="18"  height="42"  fill="#E8956D" opacity="0.9"/>
  <rect x="436" y="292" width="14"  height="30"  fill="#E8956D" opacity="0.8"/>
  <rect x="370" y="262" width="16"  height="20"  fill="white"   opacity="0.3"/>
  <rect x="394" y="256" width="12"  height="18"  fill="white"   opacity="0.25"/>
  <!-- fireplace hearth -->
  <rect x="316" y="322" width="168" height="12"  fill="#b8b0a8"/>
  <!-- mantle -->
  <rect x="282" y="226" width="236" height="14"  fill="#c8b8a8"/>
  <rect x="286" y="218" width="228" height="12"  fill="#d8c8b8"/>
  <!-- mantle decorations -->
  <rect x="298" y="200" width="14"  height="20"  fill="#9D74A1" opacity="0.7"/>
  <rect x="320" y="204" width="10"  height="16"  fill="#E8C97A" opacity="0.8"/>
  <rect x="454" y="204" width="10"  height="16"  fill="#E8C97A" opacity="0.8"/>
  <rect x="472" y="200" width="14"  height="20"  fill="#9D74A1" opacity="0.7"/>
  <!-- clock on mantle -->
  <rect x="384" y="196" width="32"  height="24"  fill="#8B6C4A"/>
  <rect x="388" y="200" width="24"  height="16"  fill="#e8e4dc"/>
  <rect x="399" y="203" width="2"   height="8"   fill="#555"/>
  <rect x="399" y="203" width="6"   height="2"   fill="#555"/>

  <!-- ── SOFA HINT (in front of fireplace) ── -->
  <rect x="220" y="330" width="360" height="50"  fill="#9D74A1" opacity="0.6"/>
  <rect x="220" y="326" width="360" height="10"  fill="#7a5080" opacity="0.7"/>
  <!-- sofa cushions -->
  <rect x="228" y="332" width="78"  height="40"  fill="#8a4070" opacity="0.5"/>
  <rect x="314" y="332" width="78"  height="40"  fill="#8a4070" opacity="0.5"/>
  <rect x="400" y="332" width="78"  height="40"  fill="#8a4070" opacity="0.5"/>
  <rect x="486" y="332" width="86"  height="40"  fill="#8a4070" opacity="0.5"/>
  <!-- sofa arms -->
  <rect x="220" y="326" width="18"  height="54"  fill="#7a5080" opacity="0.7"/>
  <rect x="562" y="326" width="18"  height="54"  fill="#7a5080" opacity="0.7"/>

  <!-- ── SIDE WINDOWS ── -->
  <!-- left window -->
  <rect x="116" y="140" width="120" height="100" fill="#7AB8D4" opacity="0.5"/>
  <rect x="116" y="186" width="120" height="6"   fill="white" opacity="0.4"/>
  <rect x="174" y="140" width="6"   height="100" fill="white" opacity="0.4"/>
  <!-- curtains left -->
  <rect x="116" y="136" width="20"  height="108" fill="#E8A0A0" opacity="0.6"/>
  <rect x="218" y="136" width="18"  height="108" fill="#E8A0A0" opacity="0.6"/>
  <!-- right window -->
  <rect x="564" y="140" width="120" height="100" fill="#7AB8D4" opacity="0.5"/>
  <rect x="564" y="186" width="120" height="6"   fill="white" opacity="0.4"/>
  <rect x="622" y="140" width="6"   height="100" fill="white" opacity="0.4"/>
  <!-- curtains right -->
  <rect x="564" y="136" width="20"  height="108" fill="#E8A0A0" opacity="0.6"/>
  <rect x="666" y="136" width="18"  height="108" fill="#E8A0A0" opacity="0.6"/>

  <!-- ── ARCH FRAME ── -->
  <rect x="100" y="100" width="14"  height="280" fill="#d0ccc4"/>
  <rect x="686" y="100" width="14"  height="280" fill="#d0ccc4"/>
  <rect x="100" y="88"  width="600" height="16"  fill="#d0ccc4"/>
  <rect x="110" y="76"  width="580" height="14"  fill="#d0ccc4"/>
  <rect x="124" y="66"  width="552" height="12"  fill="#d0ccc4"/>
  <rect x="140" y="58"  width="520" height="10"  fill="#d0ccc4"/>
  <rect x="158" y="52"  width="484" height="10"  fill="#d0ccc4"/>
  <!-- arch interior fill -->
  <rect x="114" y="90"  width="572" height="12"  fill="#f0ebe2"/>
  <rect x="126" y="78"  width="548" height="14"  fill="#f0ebe2"/>
  <rect x="140" y="66"  width="520" height="14"  fill="#f0ebe2"/>
  <rect x="156" y="58"  width="488" height="10"  fill="#f0ebe2"/>

  <text x="400" y="430" text-anchor="middle" font-family="monospace" font-size="11" fill="#8B6C4A">FANCY ROOM</text>

  <!-- ── NAV BUTTON (back to forward view) ── -->
  <a onclick="goTo('foyer')" style="cursor:pointer">
    <rect x="16" y="220" width="36" height="60" fill="#0d1b2a" stroke="#E8C97A" stroke-width="2" rx="2"/>
    <text x="34" y="256" text-anchor="middle" font-family="monospace" font-size="20" fill="#E8C97A">&#8592;</text>
  </a>

  <!-- ── EXIT BUTTON ── -->
  <a onclick="goTo('exterior')" style="cursor:pointer">
    <rect x="16" y="452" width="72" height="26" fill="#0d1b2a" stroke="#E8C97A" stroke-width="2" rx="2"/>
    <text x="52" y="470" text-anchor="middle" font-family="monospace" font-size="11" fill="#E8C97A">[ EXIT ]</text>
  </a>

</svg>