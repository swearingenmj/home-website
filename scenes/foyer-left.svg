  <rect x="322" y="268" width="32"  height="32"  fill="#8B6C4A"/>
  <rect x="326" y="272" width="24"  height="24"  fill="#a07840" opacity="0.5"/>
  <rect x="322" y="314" width="6"   height="30"  fill="#7a5a30"/>
  <rect x="346" y="314" width="6"   height="30"  fill="#7a5a30"/>

<!-- dining table -->
  <rect x="130" y="292" width="240" height="16"  fill="#8B6C4A"/>
  <!-- table legs -->
  <rect x="138" y="308" width="10"  height="50"  fill="#7a5a30"/>
  <rect x="352" y="308" width="10"  height="50"  fill="#7a5a30"/>
  
    <!-- candle centerpiece -->
  <rect x="244" y="274" width="8"   height="18"  fill="#fff" opacity="0.9"/>
  <rect x="246" y="270" width="4"   height="6"   fill="#E8C97A" opacity="0.9"/>

  <!-- room floor hint -->
  <rect x="100" y="350" width="300" height="30"  fill="#c8a86b" opacity="0.35"/>

  <!-- arch frame -->
  <rect x="100" y="160" width="14"  height="220" fill="#d0ccc4"/>
  <rect x="386" y="160" width="14"  height="220" fill="#d0ccc4"/>
  <rect x="100" y="148" width="300" height="16"  fill="#d0ccc4"/>
