  <!-- ══ BASEMENT DOOR (right of center) ══ -->
  <rect x="500" y="200" width="90"  height="180" fill="#b89050"/>
  <rect x="502" y="202" width="86"  height="176" fill="#a07840"/>
  <rect x="510" y="212" width="70"  height="66"  fill="#b89050"/>
  <rect x="510" y="290" width="70"  height="66"  fill="#b89050"/>
  <rect x="572" y="284" width="10"  height="10"  fill="#E8C97A"/>
  <rect x="496" y="194" width="100" height="10"  fill="#d0ccc4"/>
  <rect x="496" y="194" width="10"  height="190" fill="#d0ccc4"/>
  <rect x="586" y="194" width="10"  height="190" fill="#d0ccc4"/>

  <text x="546" y="430" text-anchor="middle" font-family="monospace" font-size="11" fill="#8B6C4A">BASEMENT</text>

