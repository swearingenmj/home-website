<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">

  <!-- ── SKY ── -->
  <rect x="0" y="0" width="800" height="500" fill="#0d1b2a"/>

  <!-- sunset glow at horizon -->
  <rect x="0" y="280" width="800" height="20" fill="#E8956D" opacity="0.25"/>
  <rect x="0" y="290" width="800" height="15" fill="#E8A0A0" opacity="0.15"/>

  <!-- stars -->
  <rect x="30"  y="20"  width="3" height="3" fill="white"   class="star"      style="animation-delay:0s"/>
  <rect x="90"  y="40"  width="2" height="2" fill="#E8C97A" class="star"      style="animation-delay:0.7s"/>
  <rect x="160" y="15"  width="3" height="3" fill="white"   class="star-slow" style="animation-delay:1.3s"/>
  <rect x="240" y="30"  width="2" height="2" fill="#E8A0A0" class="star"      style="animation-delay:0.4s"/>
  <rect x="330" y="12"  width="3" height="3" fill="white"   class="star-slow" style="animation-delay:1.8s"/>
  <rect x="420" y="25"  width="2" height="2" fill="#E8C97A" class="star"      style="animation-delay:0.9s"/>
  <rect x="510" y="18"  width="3" height="3" fill="white"   class="star"      style="animation-delay:1.1s"/>
  <rect x="600" y="35"  width="2" height="2" fill="#E8A0A0" class="star-slow" style="animation-delay:0.3s"/>
  <rect x="680" y="14"  width="3" height="3" fill="white"   class="star"      style="animation-delay:1.6s"/>
  <rect x="750" y="40"  width="2" height="2" fill="#E8C97A" class="star"      style="animation-delay:0.5s"/>

  <!-- ── GROUND / GRASS ── -->
  <rect x="0"   y="370" width="800" height="130" fill="#1a3a1a"/>
  <rect x="0"   y="370" width="800" height="8"   fill="#2a5a2a"/>

  <!-- ── ROAD ── -->
  <rect x="0"   y="440" width="800" height="60"  fill="#2a2a2a"/>
  <rect x="0"   y="440" width="800" height="4"   fill="#3a3a3a"/>
  <!-- road dashes -->
  <rect x="60"  y="465" width="60" height="6" fill="#E8C97A" opacity="0.5"/>
  <rect x="200" y="465" width="60" height="6" fill="#E8C97A" opacity="0.5"/>
  <rect x="340" y="465" width="60" height="6" fill="#E8C97A" opacity="0.5"/>
  <rect x="480" y="465" width="60" height="6" fill="#E8C97A" opacity="0.5"/>
  <rect x="620" y="465" width="60" height="6" fill="#E8C97A" opacity="0.5"/>

  <!-- ── BRICK PATH ── -->
  <rect x="348" y="370" width="104" height="75" fill="#8B4513" opacity="0.7"/>
  <rect x="350" y="372" width="28" height="10" fill="#A0522D" opacity="0.6"/>
  <rect x="382" y="372" width="28" height="10" fill="#8B4513" opacity="0.6"/>
  <rect x="414" y="372" width="34" height="10" fill="#A0522D" opacity="0.6"/>
  <rect x="350" y="386" width="34" height="10" fill="#8B4513" opacity="0.6"/>
  <rect x="388" y="386" width="28" height="10" fill="#A0522D" opacity="0.6"/>
  <rect x="420" y="386" width="28" height="10" fill="#8B4513" opacity="0.6"/>
  <rect x="350" y="400" width="28" height="10" fill="#A0522D" opacity="0.6"/>
  <rect x="382" y="400" width="34" height="10" fill="#8B4513" opacity="0.6"/>
  <rect x="420" y="400" width="28" height="10" fill="#A0522D" opacity="0.6"/>
  <rect x="350" y="414" width="34" height="10" fill="#8B4513" opacity="0.6"/>
  <rect x="388" y="414" width="28" height="10" fill="#A0522D" opacity="0.6"/>
  <rect x="420" y="414" width="28" height="10" fill="#8B4513" opacity="0.6"/>

  <!-- ── LEFT TREES ── -->
  <rect x="60"  y="310" width="16" height="65" fill="#3d2a10"/>
  <rect x="44"  y="250" width="48" height="68" fill="#2a5a2a"/>
  <rect x="50"  y="220" width="36" height="38" fill="#2a5a2a"/>
  <rect x="56"  y="196" width="24" height="30" fill="#3a7a3a"/>

  <rect x="140" y="320" width="14" height="55" fill="#3d2a10"/>
  <rect x="126" y="265" width="42" height="60" fill="#1a4a1a"/>
  <rect x="132" y="240" width="30" height="32" fill="#2a5a2a"/>
  <rect x="138" y="218" width="18" height="28" fill="#3a7a3a"/>

  <!-- ── RIGHT TREES ── -->
  <rect x="640" y="315" width="16" height="60" fill="#3d2a10"/>
  <rect x="624" y="255" width="48" height="66" fill="#2a5a2a"/>
  <rect x="630" y="226" width="36" height="36" fill="#2a5a2a"/>
  <rect x="636" y="202" width="24" height="30" fill="#3a7a3a"/>

  <rect x="720" y="322" width="14" height="53" fill="#3d2a10"/>
  <rect x="706" y="268" width="42" height="58" fill="#1a4a1a"/>
  <rect x="712" y="244" width="30" height="30" fill="#2a5a2a"/>
  <rect x="718" y="222" width="18" height="26" fill="#3a7a3a"/>

  <!-- ── RIGHT GARAGE ── -->
  <rect x="570" y="260" width="140" height="118" fill="#e0ddd8"/>
  <polygon points="555,260 640,190 730,260" fill="#7a5a8a"/>
  <!-- garage door -->
  <rect x="582" y="290" width="116" height="80" fill="#c8c5c0"/>
  <rect x="582" y="303" width="116" height="4"  fill="#aaa"/>
  <rect x="582" y="316" width="116" height="4"  fill="#aaa"/>
  <rect x="582" y="329" width="116" height="4"  fill="#aaa"/>
  <rect x="582" y="342" width="116" height="4"  fill="#aaa"/>
  <!-- garage window -->
  <rect x="600" y="268" width="20" height="18" fill="#7AB8D4" opacity="0.8"/>
  <rect x="630" y="268" width="20" height="18" fill="#7AB8D4" opacity="0.8"/>
  <rect x="660" y="268" width="20" height="18" fill="#7AB8D4" opacity="0.8"/>

  <!-- ── MAIN HOUSE BODY ── -->
  <rect x="220" y="220" width="340" height="155" fill="white"/>

  <!-- ROOF -->
  <polygon points="195,220 390,95 585,220" fill="#9D74A1"/>

  <!-- CHIMNEY -->
  <rect x="460" y="118" width="28" height="70" fill="#7a5a8a"/>
  <rect x="456" y="114" width="36" height="10" fill="#6a4a7a"/>

  <!-- LEFT WINDOW -->
  <rect x="240" y="240" width="55" height="50" fill="#7AB8D4"/>
  <rect x="240" y="262" width="55" height="5"  fill="white"/>
  <rect x="264" y="240" width="5"  height="50" fill="white"/>

  <!-- RIGHT WINDOW -->
  <rect x="485" y="240" width="55" height="50" fill="#7AB8D4"/>
  <rect x="485" y="262" width="55" height="5"  fill="white"/>
  <rect x="509" y="240" width="5"  height="50" fill="white"/>

  <!-- FRONT DOOR -->
  <rect x="348" y="278" width="84" height="97" fill="#cc0000"/>
  <rect x="356" y="288" width="30" height="25" fill="#dd2222"/>
  <rect x="394" y="288" width="30" height="25" fill="#dd2222"/>
  <rect x="356" y="320" width="30" height="25" fill="#dd2222"/>
  <rect x="394" y="320" width="30" height="25" fill="#dd2222"/>
  <rect x="408" y="308" width="8"  height="8"  fill="#E8C97A"/>

  <!-- ── CLICKABLE ZONES ── -->

  <!-- House → foyer -->
  <a onclick="goTo('foyer')" style="cursor:pointer">
    <rect x="220" y="95" width="340" height="280" fill="transparent"/>
  </a>

  <!-- Left side → garage -->
  <a onclick="goTo('garage')" style="cursor:pointer">
    <rect x="0" y="200" width="220" height="244" fill="transparent"/>
  </a>

  <!-- Right garage → garage -->
  <a onclick="goTo('garage')" style="cursor:pointer">
    <rect x="560" y="190" width="240" height="284" fill="transparent"/>
  </a>

  <!-- Road → street -->
  <a onclick="goTo('street')" style="cursor:pointer">
    <rect x="0" y="440" width="800" height="60" fill="transparent"/>
  </a>

</svg>