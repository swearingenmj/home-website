<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">

  <!-- ── FLOOR ── -->
  <rect x="0" y="380" width="800" height="120" fill="#c8a86b"/>
  <rect x="0"   y="388" width="800" height="3" fill="#b89050" opacity="0.4"/>
  <rect x="0"   y="403" width="800" height="3" fill="#b89050" opacity="0.4"/>
  <rect x="0"   y="418" width="800" height="3" fill="#b89050" opacity="0.4"/>
  <rect x="0"   y="433" width="800" height="3" fill="#b89050" opacity="0.4"/>
  <rect x="0"   y="448" width="800" height="3" fill="#b89050" opacity="0.4"/>
  <rect x="100" y="380" width="2" height="120" fill="#b89050" opacity="0.3"/>
  <rect x="250" y="380" width="2" height="120" fill="#b89050" opacity="0.3"/>
  <rect x="400" y="380" width="2" height="120" fill="#b89050" opacity="0.3"/>
  <rect x="550" y="380" width="2" height="120" fill="#b89050" opacity="0.3"/>
  <rect x="700" y="380" width="2" height="120" fill="#b89050" opacity="0.3"/>

  <!-- ── BACK WALL ── -->
  <rect x="0" y="80" width="800" height="310" fill="#f0ece4"/>

  <!-- ── CEILING ── -->
  <rect x="0" y="0" width="800" height="80" fill="#e8e4dc"/>
  <rect x="0" y="76" width="800" height="6"  fill="#d8d4cc"/>

  <!-- ── SIDE WALLS ── -->
  <rect x="0"   y="0" width="50"  height="500" fill="#e0dcd4"/>
  <rect x="750" y="0" width="50"  height="500" fill="#e0dcd4"/>

  <!-- ── WAINSCOTING ── -->
  <rect x="50" y="305" width="700" height="85" fill="#e8e4de"/>
  <rect x="50" y="303" width="700" height="5"  fill="#d8d4ce"/>
  <rect x="66"  y="316" width="96" height="62" fill="none" stroke="#d0ccc4" stroke-width="2"/>
  <rect x="178" y="316" width="96" height="62" fill="none" stroke="#d0ccc4" stroke-width="2"/>
  <rect x="290" y="316" width="96" height="62" fill="none" stroke="#d0ccc4" stroke-width="2"/>
  <rect x="402" y="316" width="96" height="62" fill="none" stroke="#d0ccc4" stroke-width="2"/>
  <rect x="514" y="316" width="96" height="62" fill="none" stroke="#d0ccc4" stroke-width="2"/>
  <rect x="626" y="316" width="96" height="62" fill="none" stroke="#d0ccc4" stroke-width="2"/>

  <!-- ══ STAIR SPACE (left side, empty for now) ══ -->

  <!-- stair triangle foundation -->
<polygon points="50,390 50,200 400,390" fill="#d4d0ca" stroke="white" stroke-width="8"/>

  <!-- spindles -->
  <line x1="88"  y1="120" x2="88"  y2="220" stroke="white" stroke-width="4"/>
<line x1="126" y1="142" x2="126" y2="240" stroke="white" stroke-width="4"/>
<line x1="164" y1="165" x2="164" y2="263" stroke="white" stroke-width="4"/>
<line x1="202" y1="186" x2="202" y2="282" stroke="white" stroke-width="4"/>
<line x1="240" y1="208" x2="240" y2="304" stroke="white" stroke-width="4"/>
<line x1="278" y1="230" x2="278" y2="325" stroke="white" stroke-width="4"/>
<line x1="316" y1="253" x2="316" y2="345" stroke="white" stroke-width="4"/>
<line x1="354" y1="275" x2="354" y2="365" stroke="white" stroke-width="4"/>
<line x1="382" y1="290" x2="382" y2="380" stroke="white" stroke-width="4"/>

<!-- handrail along top edge of triangle -->
  <line x1="50" y1="100" x2="400" y2="300"
      stroke="#8B6C4A" stroke-width="8" stroke-linecap="round"/>

    <text x="200" y="470" text-anchor="middle" font-family="monospace" font-size="11" fill="#8B6C4A">UPSTAIRS</text>


  <!-- ══ KITCHEN DOOR ══ -->
  <!-- door frame -->
  <rect x="500" y="90"  width="12"  height="302" fill="#e0dcd4"/>
  <rect x="648" y="90"  width="12"  height="302" fill="#e0dcd4"/>
  <rect x="500" y="90"  width="160" height="12"  fill="#e0dcd4"/>

  <!-- room beyond: visible only inside left side of frame, gap between frame and door -->
  <rect x="512" y="102" width="160" height="290" fill="#e8dfc8"/>
  <!-- cabinet hint in kitchen -->
  <rect x="520" y="118" width="60"  height="52"  fill="#c8b88a"/>
  <rect x="520" y="118" width="60"  height="6"   fill="#a09060"/>
  <rect x="520" y="118" width="4"   height="52"  fill="#a09060"/>
  <rect x="576" y="118" width="4"   height="52"  fill="#a09060"/>
  <rect x="532" y="140" width="6"   height="6"   fill="#E8C97A"/>
  <!-- counter hint -->
  <rect x="512" y="302" width="136" height="14"  fill="#c8b88a"/>
  <rect x="512" y="298" width="136" height="6"   fill="#a09060"/>
  <!-- kitchen floor -->
  <rect x="512" y="316" width="136" height="76"  fill="#c0b080"/>

  <!-- door panel: hinged RIGHT side, swings left/inward -->
  <!-- door sits toward the right of the frame, gap on left shows kitchen -->
  <rect x="570" y="102" width="90"  height="290" fill="#f4f0ea"/>
  <!-- 6 panels: 2 col x 3 row -->
  <rect x="578" y="116" width="34"  height="66"  fill="none" stroke="#d8d4cc" stroke-width="2"/>
  <rect x="618" y="116" width="34"  height="66"  fill="none" stroke="#d8d4cc" stroke-width="2"/>
  <rect x="578" y="194" width="34"  height="66"  fill="none" stroke="#d8d4cc" stroke-width="2"/>
  <rect x="618" y="194" width="34"  height="66"  fill="none" stroke="#d8d4cc" stroke-width="2"/>
  <rect x="578" y="272" width="34"  height="66"  fill="none" stroke="#d8d4cc" stroke-width="2"/>
  <rect x="618" y="272" width="34"  height="66"  fill="none" stroke="#d8d4cc" stroke-width="2"/>
  <!-- door knob on left edge of door panel -->
  <rect x="572" y="238" width="10"  height="10"  fill="#c8a86b"/>
  <rect x="568" y="240" width="6"   height="6"   fill="#a08040"/>
  <!-- door edge shadow (depth, right side hinged) -->
  <rect x="656" y="102" width="6"   height="290" fill="#c8c4be" opacity="0.6"/>

  <text x="575" y="470" text-anchor="middle" font-family="monospace" font-size="11" fill="#8B6C4A">KITCHEN</text>

  <!-- ── NAV BUTTONS ── -->
  <a onclick="goTo('foyer-left')" style="cursor:pointer">
    <rect x="16" y="210" width="36" height="60" fill="#0d1b2a" stroke="#E8C97A" stroke-width="2" rx="2"/>
    <text x="34" y="246" text-anchor="middle" font-family="monospace" font-size="20" fill="#E8C97A">&#8592;</text>
  </a>
  <a onclick="goTo('foyer-right')" style="cursor:pointer">
    <rect x="748" y="210" width="36" height="60" fill="#0d1b2a" stroke="#E8C97A" stroke-width="2" rx="2"/>
    <text x="766" y="246" text-anchor="middle" font-family="monospace" font-size="20" fill="#E8C97A">&#8594;</text>
  </a>
  <a onclick="goTo('kitchen-right')" style="cursor:pointer">
  <rect x="520" y="90" width="140" height="302" fill="transparent"/>
</a>

  <!-- ── EXIT BUTTON ── -->
  <a onclick="goTo('exterior')" style="cursor:pointer">
    <rect x="16" y="452" width="72" height="26" fill="#0d1b2a" stroke="#E8C97A" stroke-width="2" rx="2"/>
    <text x="52" y="470" text-anchor="middle" font-family="monospace" font-size="11" fill="#E8C97A">[ EXIT ]</text>
  </a>

</svg>